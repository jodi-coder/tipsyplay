<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0D0F1A">
<meta name="robots" content="noindex">
<meta name="description" content="The TipsyPlay shared screen for a TV or laptop: room code, join QR, prompts, timers, reveals and scores in large type.">
<title>TipsyPlay Display – Show the Game on a TV</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preload" href="../fonts/bricolage-grotesque-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../styles.css?v=31">
<link rel="stylesheet" href="party-games.css?v=1">
</head>
<body class="tv" data-root="../">
<div class="tv-wrap">
<div class="tv-top">
<span class="logo tv-brand">tipsy<span>play</span></span>
<div class="tv-join hide" id="joinbox"><canvas id="joinqr" width="180" height="180" role="img" aria-label="QR code to join"></canvas><div><span>Join on your phone</span><b id="joincode"></b></div></div>
<div class="tv-tools">
<button type="button" id="tunebtn" aria-pressed="false">Lobby music: off</button>
<button type="button" class="mute" id="mute" aria-label="Mute sound effects" aria-pressed="false">🔊</button>
</div>
</div>
<main id="tvmain" class="tv-main" aria-live="polite">
<section id="pickroom" class="tv-lobby">
<h1>Show the game on this screen</h1>
<p class="tv-note">Enter the room code from the host's phone.</p>
<form id="roomform" class="join-row" style="max-width:520px;margin:0 auto">
<input class="bigin" id="roomin" maxlength="80" autocomplete="off" autocapitalize="characters" placeholder="Room code" aria-label="Room code">
<button type="submit" class="btn host-cta">Show</button>
</form>
<p id="tverr" class="tv-note" role="alert"></p>
</section>
<section id="lobbyview" class="tv-lobby hide">
<p class="cs-eyebrow" id="gamename"></p>
<h1>Grab your phone and join</h1>
<p class="tv-code" id="bigcode"></p>
<canvas id="bigqr" width="260" height="260" role="img" aria-label="QR code to join"></canvas>
<p class="tv-note" id="joinurl"></p>
<ul class="tv-players" id="tvplayers"></ul>
<p class="tv-note" id="lobbyline"></p>
</section>
<section id="gameview" class="hide"></section>
<p class="tv-note hide" id="soundhint">Tap or click anywhere once to turn on sound.</p>
</main>
<p class="tv-age"><strong>You must be of legal drinking age in your location.</strong></p>
</div>
<p class="tv-strip">Drinking is optional. Pass any time. <a href="../responsible.html">Play responsibly</a></p>
<script src="../sounds.js?v=18"></script>
<script src="qr.js?v=18"></script>
<script src="join-qr.js?v=1"></script>
<script src="party-fx.js?v=1"></script>
<script src="court-logic.js?v=1"></script>
<script src="court-screen.js?v=1"></script>
<script src="countdown-logic.js?v=1"></script>
<script src="countdown-screen.js?v=1"></script>
<script src="display.js?v=1"></script>
</body>
</html>
